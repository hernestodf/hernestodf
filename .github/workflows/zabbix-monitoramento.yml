name: Laboratorio Zabbix - CI
on:
  push:
    paths:
      - 'labs/zabbix-monitoramento/**'
      - '.github/workflows/zabbix-monitoramento.yml'
  pull_request:
    paths:
      - 'labs/zabbix-monitoramento/**'
      - '.github/workflows/zabbix-monitoramento.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/zabbix-monitoramento
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Testes do simulador
        run: python -m unittest discover -s tests -v
      - name: Validar Compose
        env:
          POSTGRES_PASSWORD: somente-ci-ficticio
        run: docker compose config -q
