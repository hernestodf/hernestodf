name: Lab disaster-recovery
on:
  push:
    paths: ['labs/disaster-recovery/**', '.github/workflows/disaster-recovery.yml']
  pull_request:
    paths: ['labs/disaster-recovery/**', '.github/workflows/disaster-recovery.yml']
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: labs/disaster-recovery
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -v && python3 recuperar.py
