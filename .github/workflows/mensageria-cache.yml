name: Lab mensageria-cache
on:
  push:
    paths: ['labs/mensageria-cache/**', '.github/workflows/mensageria-cache.yml']
  pull_request:
    paths: ['labs/mensageria-cache/**', '.github/workflows/mensageria-cache.yml']
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: labs/mensageria-cache
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d
      - run: python3 testar.py
      - if: always()
        run: docker compose logs --tail=50
      - if: always()
        run: docker compose down -v
