name: Lab devsecops
on:
  push:
    paths: ['labs/devsecops/**', '.github/workflows/devsecops.yml']
  pull_request:
    paths: ['labs/devsecops/**', '.github/workflows/devsecops.yml']
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: labs/devsecops
    steps:
      - uses: actions/checkout@v4
      - run: bash testar.sh
