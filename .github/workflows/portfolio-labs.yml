name: Portfolio Labs CI
on:
  push:
    paths:
      - 'labs/**'
      - '.github/workflows/portfolio-labs.yml'
  pull_request:
    paths:
      - 'labs/**'
      - '.github/workflows/portfolio-labs.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [profox-devops-lab, profox-go-backend]
    defaults:
      run:
        working-directory: labs/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go mod tidy
      - run: go test ./...
      - run: go vet ./...
      - run: docker build .
