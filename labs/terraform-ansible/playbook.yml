- name: Configurar arquivo ficticio
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Gravar configuracao
      ansible.builtin.copy:
        dest: "{{ demo_dir }}/servico.conf"
        content: |
          servico={{ servico }}
          ambiente={{ ambiente }}
        mode: '0600'
      register: configurado
    - name: Verificar idempotencia quando solicitado
      ansible.builtin.assert:
        that:
          - not configurado.changed
      when: verificar_idempotencia | default(false) | bool
