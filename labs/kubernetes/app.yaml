apiVersion: v1
kind: Namespace
metadata:
  name: profox-k8s-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: profox-k8s-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: profox-k8s-demo
spec:
  selector:
    app: portal
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
