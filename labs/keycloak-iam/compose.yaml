services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev","--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: demo
      KC_BOOTSTRAP_ADMIN_PASSWORD: somente-lab
    ports: ["127.0.0.1:18082:8080"]
    volumes:
      - ./realm.json:/opt/keycloak/data/import/demo-realm.json:ro
