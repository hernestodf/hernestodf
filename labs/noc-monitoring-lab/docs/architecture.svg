<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Laboratório de Monitoramento NOC — Arquitetura</title>
<desc id="desc">Operador simula incidentes no serviço Python. Prometheus coleta métricas, envia alertas ao Alertmanager e alimenta o Grafana. Runbooks documentam investigação e recuperação.</desc>
<rect width="1200" height="580" rx="24" fill="#0b1220"/>
