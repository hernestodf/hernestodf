services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_local_only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgres://demo:demo_local_only@db:5432/demo?sslmode=disable
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
